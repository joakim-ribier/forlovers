name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Every Monday: new vulnerabilities are published even when nothing is pushed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: typecheck and build (astro check + astro build)
        run: npm run build

      - name: no inline script (the Content-Security-Policy forbids them)
        run: |
          # Each <script> tag on its own (the built page is one line): any without src= is inline.
          if grep -oE '<script[^>]*>' dist/index.html | grep -v 'src='; then
            echo "Inline script in dist/index.html: move it to public/ (see heart-still.js)"; exit 1
          fi

      - name: no third-party font or script
        run: |
          if grep -E 'fonts\.(googleapis|gstatic)\.com|<script[^>]+src="https?://' dist/index.html; then
            echo "Third-party resource in dist/index.html"; exit 1
          fi

      - name: dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not just the last commit

      - name: secrets in the history (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
