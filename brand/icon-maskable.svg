<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>forlovers</title>
  <!-- Android maskable: full-bleed square, the heart kept inside the 72% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1020"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <path id="heart" d="M-400 420 C180 420 330 390 430 312 C372 252 392 132 500 132 C566 132 596 178 600 214 C604 178 634 132 700 132 C808 132 828 252 770 312 C700 384 626 430 600 476 C650 430 820 420 1600 420"/>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 262) scale(0.7) translate(-600 -304)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#heart" stroke="#ff2d78" stroke-opacity=".7" stroke-width="38" filter="url(#glow)"/>
    <use href="#heart" stroke="#ff2d78" stroke-opacity=".55" stroke-width="26"/>
    <use href="#heart" stroke="#ffe0eb" stroke-width="12"/>
  </g>
</svg>
