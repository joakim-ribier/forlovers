<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>forlovers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1020"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff2d78" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff2d78" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <!-- The heart from the home page: the line comes in from the left, draws the
         heart without closing its lower left side, and leaves on the right. -->
    <path id="heart" d="M-400 420 C180 420 330 390 430 312 C372 252 392 132 500 132 C566 132 596 178 600 214 C604 178 634 132 700 132 C808 132 828 252 770 312 C700 384 626 430 600 476 C650 430 820 420 1600 420"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="262" r="210" fill="url(#warm)"/>
    <g transform="translate(256 262) scale(0.82) translate(-600 -304)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#heart" stroke="#ff2d78" stroke-opacity=".7" stroke-width="34" filter="url(#glow)"/>
      <use href="#heart" stroke="#ff2d78" stroke-opacity=".55" stroke-width="22"/>
      <use href="#heart" stroke="#ffe0eb" stroke-width="10"/>
    </g>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ff2d78" stroke-opacity=".18" stroke-width="3"/>
</svg>
